# Render Blueprint: сайт и Telegram-бот, оба на бесплатном тарифе
services:
  # Сайт-лендинг
  - type: web
    name: astana-coffee-express
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    headers: # картинки и иконки браузер хранит неделю и не скачивает заново
      - path: /cards/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=604800

  # Telegram-бот: бесплатный Web Service, данные — во внешней бесплатной базе Postgres
  - type: web
    name: astana-coffee-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN # токен от @BotFather
        sync: false
      - key: ADMIN_IDS # Telegram ID админов через запятую
        sync: false
      - key: DATABASE_URL # строка подключения к Postgres (например, из Neon)
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
